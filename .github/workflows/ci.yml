name: checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
        zod: ['4.1.0', '4']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm install --no-save zod@${{ matrix.zod }}
      - run: npm run check
      - run: npm run test:package -- ${{ matrix.zod }}
      - run: npm exec --package=typescript@5.7.3 -- tsc --noEmit
